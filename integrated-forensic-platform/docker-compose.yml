services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: 123456ysy
      MYSQL_DATABASE: searchable_encryption
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p123456ysy"]
      interval: 10s
      timeout: 5s
      retries: 10

  ml-service:
    build:
      context: ./backend/ml-service
    environment:
      FORENSIC_ML_ASSET_DIR: /workspace/demo/ML_Dataset/ML_Dataset
    ports:
      - "8001:8001"
    volumes:
      - ../demo:/workspace/demo:ro

  searchable-encryption-api:
    build:
      context: ..
      dockerfile: integrated-forensic-platform/backend/searchable-encryption-api/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SE_DB_HOST: mysql
      SE_DB_PORT: 3306
      SE_DB_NAME: searchable_encryption
      SE_DB_USER: root
      SE_DB_PASSWORD: 123456ysy
    ports:
      - "8082:8082"
    volumes:
      - ../demo:/workspace/demo:ro

volumes:
  mysql-data:
